name: Deploy production

# Ostrý web: Cloudflare Worker `raclette` (raclettelovers.cz/.sk/.ch a aliasy).
# Po sloučení do main (a ručně přes workflow_dispatch) se po testech nasadí Worker.
# Ideálně repository secret CLOUDFLARE_API_TOKEN. Bez něj se wrangler přeskočí
# (Cloudflare Workers Builds z Gitu může nasadit sám) a workflow ověří živý web.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://raclettelovers.cz/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nasadit Cloudflare Worker
        id: wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Chybí secret CLOUDFLARE_API_TOKEN — wrangler deploy přeskočen."
            echo "Přidej Settings → Secrets → Actions → CLOUDFLARE_API_TOKEN,"
            echo "nebo spoléhej na Cloudflare Workers Builds napojený na main."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Ověřit ostrý web
        run: |
          set -e
          sleep 8
          for base in https://raclettelovers.cz https://raclettelovers.sk https://raclettelovers.ch; do
            echo "Kontrola $base/"
            code=$(curl -sS -o /tmp/home.html -w "%{http_code}" "$base/")
            test "$code" = "200"
            grep -q "pro-partnery" /tmp/home.html
            test "$(grep -c 'partner-form' /tmp/home.html || true)" = "0"
            echo "Kontrola $base/pro-partnery"
            code=$(curl -sSL -o /tmp/partners.html -w "%{http_code}" "$base/pro-partnery")
            test "$code" = "200"
            grep -q "partner-form" /tmp/partners.html
            grep -q "franchise-page" /tmp/partners.html
          done
          if curl -sS https://raclettelovers.cz/js/site.js | grep -q 'formsubmit.co/ajax/milan@raclette-original.com'; then
            echo "Formulář míří na FormSubmit / Milan — OK."
          else
            echo "::warning::Na .cz zatím není nový FormSubmit endpoint (Workers Builds nebo ruční deploy ještě nedoběhl)."
          fi
          echo "Ostrý Worker odpovídá."
