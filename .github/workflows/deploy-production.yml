name: Deploy production

# Ostré nasazení se nespouští samo. Až po schválení testovací verze
# se na větvi main ručně spustí tento workflow a do pole se napíše NASADIT.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Potvrzení nasazení. Napiš přesně NASADIT."
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'NASADIT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Ostrý hosting ještě není připojený
        run: |
          echo "Testy prošly. Domény raclettelovers.* ani raclettepointoriginal.* ale nejsou připojené."
          echo "Tohle workflow GitHub Pages nemění. Testovací adresa zůstává https://garath33.github.io/raclette/"
          exit 1
