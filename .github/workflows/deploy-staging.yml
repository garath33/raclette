name: Deploy test environment

# Po sloučení do main vznikne zkušební web na https://garath33.github.io/raclette/
# (pruh Testovací prostředí, noindex). Ostré domény raclettelovers.cz/.sk/.ch
# nasazuje workflow Deploy production (Cloudflare Worker), ne tenhle job.
# www.raclettelovers.com zatím sdílí GitHub Pages — po merge se aktualizuje spolu
# s github.io, ale bez zkušebního pruhu (hostname není github.io).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sestavit testovací web
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml CNAME _site/
          cp -a css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
