name: Deploy test environment

# Po sloučení do main GitHub Pages aktualizuje www.raclettelovers.com.
# github.io se na www přesměruje. Obsah na www se indexuje.
# Pruh a noindex zůstávají jen pro github.io, localhost a 127.0.0.1.
# raclettelovers.cz/.sk/.ch nasazuje workflow Deploy production.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sestavit testovací web
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml CNAME _site/
          cp -a css js assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
