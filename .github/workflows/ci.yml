name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    # ubuntu-latest přechází na 26.04. Playwright 1.55 pro něj prohlížeč nemá
    # a instalace skončí dřív, než se spustí npm test. 24.04 držíme, než bude Playwright 1.61+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install all npm dependencies (including dev deps)
      - run: npm ci
        env:
          CI: true

      # Install Playwright browsers and dependencies
      - name: Install Playwright with browsers
        run: npx playwright install --with-deps chromium

      # Run the full test suite (unit + e2e)
      - run: npm test
        env:
          CI: true
