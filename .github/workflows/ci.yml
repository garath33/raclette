name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install all npm dependencies (including dev deps)
      - run: npm ci
        env:
          CI: true

      # Install Playwright browsers and dependencies
      - name: Install Playwright with browsers
        run: npx playwright install --with-deps chromium

      # Run the full test suite (unit + e2e). Jazykové mutace sem nepatří.
      - run: npm test
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-cs
          path: test-results/visual/
          if-no-files-found: ignore

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            index.html
            pro-partnery.html
            app.html
            css/styles.css
            css/fonts.css
            js/points.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
