name: Add celeb.ig translations

on:
  push:
    branches:
      - feature/ig-card-reference
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ig-card-reference
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add celeb.ig after celeb.fb in i18n files
        run: |
          python3 << 'PY'
          from pathlib import Path

          replacements = {
              '"celeb.fb": "Sledujte naše aktuality"': '"celeb.fb": "Sledujte naše aktuality",
    "celeb.ig": "Sledujte nás na Instagramu"',
              '"celeb.fb": "Follow our news"': '"celeb.fb": "Follow our news",
    "celeb.ig": "Follow us on Instagram"',
              '"celeb.fb": "Suivez nos actualités"': '"celeb.fb": "Suivez nos actualités",
    "celeb.ig": "Suivez-nous sur Instagram"',
              '"celeb.fb": "Sledujte naše aktuality"': '"celeb.fb": "Sledujte naše aktuality",
    "celeb.ig": "Sledujte nás na Instagrame"',  # sk (same fb text)
              '"celeb.fb": "Seguite le nostre novità"': '"celeb.fb": "Seguite le nostre novità",
    "celeb.ig": "Seguiteci su Instagram"',
              '"celeb.fb": "Folgen Sie unseren Neuigkeiten"': '"celeb.fb": "Folgen Sie unseren Neuigkeiten",
    "celeb.ig": "Folgen Sie uns auf Instagram"',
              '"celeb.fb": "Śledźcie nasze aktualności"': '"celeb.fb": "Śledźcie nasze aktualności",
    "celeb.ig": "Śledźcie nas na Instagramie"',
              '"celeb.fb": "Seguid nuestras novedades"': '"celeb.fb": "Seguid nuestras novedades",
    "celeb.ig": "Síguenos en Instagram"',
              '"celeb.fb": "Следите за нашими новостями"': '"celeb.fb": "Следите за нашими новостями",
    "celeb.ig": "Следите за нами в Instagram"',
          }

          # Note: sk uses same celeb.fb text as cs; we handle carefully below

          files = ["js/i18n.js", "js/i18n-extra.js"]
          changed = False
          for fp in files:
              p = Path(fp)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              if "celeb.ig" in text:
                  print(f"{fp} already has celeb.ig")
                  continue
              # Targeted replacements
              orig = text
              text = text.replace(
                  '"celeb.fb": "Sledujte naše aktuality",',
                  '"celeb.fb": "Sledujte naše aktuality",
    "celeb.ig": "Sledujte nás na Instagramu",',
                  1  # only first (cs) in i18n.js; sk is in extra
              )
              # For sk in extra (second occurrence of same string)
              if "sk:" in text and text.count('"celeb.fb": "Sledujte naše aktuality"') >= 1:
                  # replace remaining in extra
                  text = text.replace(
                      '"celeb.fb": "Sledujte naše aktuality",',
                      '"celeb.fb": "Sledujte naše aktuality",
    "celeb.ig": "Sledujte nás na Instagrame",',
                      1
                  )
              text = text.replace(
                  '"celeb.fb": "Follow our news",',
                  '"celeb.fb": "Follow our news",
    "celeb.ig": "Follow us on Instagram",'
              )
              text = text.replace(
                  '"celeb.fb": "Suivez nos actualités",',
                  '"celeb.fb": "Suivez nos actualités",
    "celeb.ig": "Suivez-nous sur Instagram",'
              )
              text = text.replace(
                  '"celeb.fb": "Seguite le nostre novità",',
                  '"celeb.fb": "Seguite le nostre novità",
    "celeb.ig": "Seguiteci su Instagram",'
              )
              text = text.replace(
                  '"celeb.fb": "Folgen Sie unseren Neuigkeiten",',
                  '"celeb.fb": "Folgen Sie unseren Neuigkeiten",
    "celeb.ig": "Folgen Sie uns auf Instagram",'
              )
              text = text.replace(
                  '"celeb.fb": "Śledźcie nasze aktualności",',
                  '"celeb.fb": "Śledźcie nasze aktualności",
    "celeb.ig": "Śledźcie nas na Instagramie",'
              )
              text = text.replace(
                  '"celeb.fb": "Seguid nuestras novedades",',
                  '"celeb.fb": "Seguid nuestras novedades",
    "celeb.ig": "Síguenos en Instagram",'
              )
              text = text.replace(
                  '"celeb.fb": "Следите за нашими новостями",',
                  '"celeb.fb": "Следите за нашими новостями",
    "celeb.ig": "Следите за нами в Instagram",'
              )
              if text != orig:
                  p.write_text(text, encoding="utf-8")
                  print(f"Patched {fp}")
                  changed = True
              else:
                  print(f"No changes in {fp}")
          if not changed:
              print("Nothing to commit")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/i18n.js js/i18n-extra.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "i18n: celeb.ig pro Instagram kartu ve všech jazycích"
          git push origin feature/ig-card-reference
